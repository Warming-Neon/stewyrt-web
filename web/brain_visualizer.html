<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Zeitgeist Brain Visualizer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #030420; overflow: hidden; margin: 0; padding: 0; touch-action: none; font-family: 'Space Grotesk', sans-serif; }

    #canvas-container { width: 100vw; height: 100vh; position: relative; }
    canvas { display: block; }

    #tooltip {
      display: none;
      position: absolute;
      background: #000000;
      color: #E8E8E8;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 0;
      padding: 10px 20px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
      pointer-events: none;
      z-index: 100;
      white-space: nowrap;
      text-align: center;
    }
    #back-button {
      display: none;
      position: absolute;
      top: 16px;
      left: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      border: none;
      cursor: pointer;
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #spin-button {
      position: absolute;
      bottom: 24px;
      right: 20px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.15);
      cursor: pointer;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    #spin-button.active {
      background: rgba(100,60,255,0.35);
      border-color: rgba(180,140,255,0.6);
      box-shadow: 0 0 12px rgba(140,80,255,0.5);
    }
    #spin-button svg {
      transition: transform 0.3s;
    }
    #spin-button.active svg {
      animation: spin-icon 2s linear infinite;
    }
    @keyframes spin-icon {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>
<div id="canvas-container">
  <div id="tooltip"><span id="tt-pct"></span></div>
</div>
<button id="back-button">
  <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M11 4L6 9L11 14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
<button id="spin-button" title="Auto-rotate">
  <!-- Material: autorenew -->
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 14.8A5.87 5.87 0 0 1 6 12c0-3.31 2.69-6 6-6zm6.76 1.74L17.3 9.2c.44 1.01.7 2.12.7 2.8 0 3.31-2.69 6-6 6v-3l-4 4 4 4v-3c4.42 0 8-3.58 8-8 0-1.57-.46-3.03-1.24-4.26z" fill="rgba(255,255,255,0.75)"/>
  </svg>
</button>

<script type="importmap">
{
  "imports": {
    "three":         "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
/*
 * Scene architecture — The Resonance brain visualiser
 *  Background  : cosmic nebula — ShaderMaterial soft-circle particles across ±200 units
 *  Depth orbs  : 50–120 filler icosahedra at near-zero emissive
 *  Brain ghost : CatmullRomCurve3 outline lines + corpus callosum hint + cerebellum arc
 *  Region labels: always-camera-facing Sprite objects at region centroids
 *  Nodes       : data-driven Groups (white core + deformed membrane) placed in region bounds
 *  Node labels : always-on billboarded Sprites, one per emotion node
 *  Connections : CatmullRomCurve3 edges from Flutter payload; animated comet pulses
 *  Rendering   : direct renderer.render — no post-processing pass
 *  Perf tier   : 'high' (default) / 'low' (weak GPU or deviceMemory < 4 GB)
 */

function dbg(msg) { console.log('[BRAIN] ' + msg); }
dbg('module executing');

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Scene ────────────────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const W = container.clientWidth, H = container.clientHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.toneMapping         = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
container.appendChild(renderer.domElement);

// ─── Performance tier detection ───────────────────────────────────────────────
function detectPerformanceTier() {
  const gl     = renderer.getContext();
  const dbInfo = gl.getExtension('WEBGL_debug_renderer_info');
  const gpu    = dbInfo ? gl.getParameter(dbInfo.UNMASKED_RENDERER_WEBGL).toLowerCase() : '';
  const isWeak   = /mali|adreno 3|adreno 4|sgx|powervr|intel hd/i.test(gpu);
  const isLowMem = navigator.deviceMemory && navigator.deviceMemory < 4;
  return (isWeak || isLowMem) ? 'low' : 'high';
}
const perfTier = detectPerformanceTier();
renderer.setPixelRatio(perfTier === 'high' ? Math.min(window.devicePixelRatio, 2) : Math.min(window.devicePixelRatio, 1.5));
dbg('perfTier=' + perfTier);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030420);
scene.fog = new THREE.FogExp2(0x0a0820, 0.012);

const camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 400);
camera.position.set(0, 0, 35);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance   = 15;
controls.maxDistance   = 100;
controls.target.set(0, 0, 0);

// ─── Lights (warm violet palette) ────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x111133, 2));
[[10, 10, 10, 0x8855ff], [-10, -5, -10, 0xff2266], [0, 15, -5, 0xaa44ff]].forEach(
  ([x, y, z, c]) => { const l = new THREE.PointLight(c, 1.4, 80); l.position.set(x, y, z); scene.add(l); }
);

// ─── Filler synapses (background depth orbs) ─────────────────────────────────
const FILLER_COUNT = perfTier === 'high' ? 120 : 50;
const fillerGeo    = new THREE.IcosahedronGeometry(0.28, 1);
const fillerColors = [0x1a0a2e, 0x0a0a2e, 0x1e0a2e, 0x050510];
for (let i = 0; i < FILLER_COUNT; i++) {
  const c   = fillerColors[i % fillerColors.length];
  const mat = new THREE.MeshStandardMaterial({
    color: c, emissive: new THREE.Color(c), emissiveIntensity: 0.25,
    metalness: 0.6, roughness: 0.4,
  });
  const mesh  = new THREE.Mesh(fillerGeo, mat);
  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.acos(2 * Math.random() - 1);
  const r     = 8 + Math.random() * 10;
  mesh.position.set(
    r * 1.6 * Math.sin(phi) * Math.cos(theta),
    r * 1.0 * Math.cos(phi),
    r * 1.1 * Math.sin(phi) * Math.sin(theta)
  );
  scene.add(mesh);
}

// ─── Nebula particle field ────────────────────────────────────────────────────
// Soft-circle particles distributed across ±200 units so the brain sits inside.
// High tier: ShaderMaterial with gl_PointCoord softening.
// Low tier: PointsMaterial (no shader compile cost).
{
  const COUNT     = perfTier === 'high' ? 1200 : 400;
  const positions = new Float32Array(COUNT * 3);
  const colorBuf  = new Float32Array(COUNT * 3);
  const sizes     = new Float32Array(COUNT);

  const palette = [
    new THREE.Color(0x2d0a4e),
    new THREE.Color(0x1a0a3a),
    new THREE.Color(0x0a0a4e),
    new THREE.Color(0x3a0a2e),
    new THREE.Color(0x0a2a4e),
  ];
  const accentViolet = new THREE.Color(0x6a0aff);

  for (let i = 0; i < COUNT; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    const r     = Math.random() * 200;
    positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.cos(phi);
    positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    const isAccent = Math.random() < 0.07;
    const c        = isAccent ? accentViolet : palette[Math.floor(Math.random() * palette.length)];
    const bright   = isAccent ? (0.7 + Math.random() * 0.3) : (0.3 + Math.random() * 0.5);
    colorBuf[i * 3]     = c.r * bright;
    colorBuf[i * 3 + 1] = c.g * bright;
    colorBuf[i * 3 + 2] = c.b * bright;
    sizes[i] = 0.8 + Math.random() * 2.2;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('size',     new THREE.BufferAttribute(sizes, 1));

  if (perfTier === 'high') {
    geo.setAttribute('aColor', new THREE.BufferAttribute(colorBuf, 3));
    scene.add(new THREE.Points(geo, new THREE.ShaderMaterial({
      vertexShader: `
        attribute float size;
        attribute vec3  aColor;
        varying   vec3  vColor;
        void main() {
          vColor = aColor;
          vec4 mvp = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = size * (300.0 / -mvp.z);
          gl_Position  = projectionMatrix * mvp;
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        void main() {
          float d = length(gl_PointCoord - vec2(0.5));
          if (d > 0.5) discard;
          float alpha = smoothstep(0.5, 0.05, d) * 0.55;
          gl_FragColor = vec4(vColor, alpha);
        }
      `,
      transparent: true,
      blending:    THREE.AdditiveBlending,
      depthWrite:  false,
    })));
  } else {
    geo.setAttribute('color', new THREE.BufferAttribute(colorBuf, 3));
    scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
      size: 1.8, sizeAttenuation: true, vertexColors: true,
      transparent: true, opacity: 0.45,
      blending: THREE.AdditiveBlending, depthWrite: false,
    })));
  }
}

// ─── Brain ghost outline ──────────────────────────────────────────────────────
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

function addBrainLine(pts, opacity = 0.35) {
  const curve = new THREE.CatmullRomCurve3(pts);
  const geo   = new THREE.BufferGeometry().setFromPoints(curve.getPoints(60));
  scene.add(new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0x2a1a4e, transparent: true, opacity })));
}

addBrainLine([V3(0, 2, 8), V3(-6, 8, 4), V3(-8, 6, -2), V3(-6, 2, -8), V3(-2, -2, -8), V3(0, -4, -4)]);
addBrainLine([V3(0, 2, 8), V3( 6, 8, 4), V3( 8, 6, -2), V3( 6, 2, -8), V3( 2, -2, -8), V3(0, -4, -4)]);
addBrainLine([V3(-3, 9, 2), V3(0, 9.5, 0), V3(3, 9, 2)], 0.22);
addBrainLine([V3(-3, -5, -9), V3(0, -7, -11), V3(3, -5, -9)], 0.28);

// ─── Region zone labels (Sprites, always face camera) ────────────────────────
function regionLabelColor(text) {
  switch (text) {
    case 'Amygdala':  return '#e05a6a'; // red-pink, matches regionColor hue 0.95–1.08
    case 'Nucleus':   return '#d4a030'; // gold,     matches regionColor hue 0.12–0.28
    case 'Insula':    return '#40c9a0'; // teal,     matches regionColor hue 0.48–0.58
    default:          return '#9b6fff'; // violet,   matches Prefrontal hue 0.70–0.82
  }
}

function makeRegionSprite(text) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 22px "Space Grotesk", sans-serif';
  ctx.fillStyle = regionLabelColor(text);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  const mat = new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(canvas),
    transparent: true, opacity: 0.5, depthWrite: false,
  });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(8, 2, 1);
  return sprite;
}

const regionLabels = [];
[
  { text: 'Prefrontal', pos: V3( 0,  4,  8) },
  { text: 'Amygdala',   pos: V3( 0, -5, -3) },
  { text: 'Nucleus',    pos: V3( 0,  4, -2) },
  { text: 'Insula',     pos: V3(12,  0,  0) },
  { text: 'Insula',     pos: V3(-12, 0,  0) },
].forEach(({ text, pos }) => {
  const sprite = makeRegionSprite(text);
  sprite.position.copy(pos);
  scene.add(sprite);
  regionLabels.push({ sprite, pos });
});

// ─── Dynamic node state ───────────────────────────────────────────────────────
const nodeMeshes  = [];
const nodeDataMap = new Map();   // mesh.uuid → em
const nodesByName = new Map();   // name → em
const pathObjects = [];          // { curve, color, line, nextFireAt, activePulses[] }

let _focusTween = null;

// ─── Region position bounds ───────────────────────────────────────────────────
function regionBounds(region) {
  switch (region) {
    case 'Amygdala':  return { x: [-6, 6], y: [-8, -2], z: [-8,  2] };
    case 'Nucleus':   return { x: [-6, 6], y: [ 0,  8], z: [-6,  4] };
    case 'Insula': {
      const side = Array.from(nodesByName.values()).filter(e => e.region === 'Insula').length % 2 === 0 ? -1 : 1;
      return { x: [side * 8, side * 16], y: [-5, 5], z: [-5, 5] };
    }
    default: return { x: [-8, 8], y: [-1, 8], z: [2, 12] }; // Prefrontal
  }
}

// ─── Region colour palette (warmed up, Phase 6) ───────────────────────────────
// Returns { h, s, l } — THREE.Color.setHSL handles hue > 1 via modulo.
function regionColor(region) {
  const rng = (lo, hi) => lo + Math.random() * (hi - lo);
  switch (region) {
    case 'Amygdala': return { h: rng(0.95, 1.08), s: rng(0.90, 1.00), l: rng(0.55, 0.65) };
    case 'Nucleus':  return { h: rng(0.12, 0.28), s: rng(0.80, 0.95), l: rng(0.55, 0.65) };
    case 'Insula':   return { h: rng(0.48, 0.58), s: rng(0.85, 1.00), l: rng(0.50, 0.65) };
    default:         return { h: rng(0.70, 0.82), s: rng(0.85, 1.00), l: rng(0.55, 0.70) }; // Prefrontal
  }
}

// ─── Always-on node label sprite ─────────────────────────────────────────────
function makeNodeSprite(text) {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 32;
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 14px "Space Grotesk", sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 64, 16);
  const mat = new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(canvas),
    transparent: true, depthWrite: false,
  });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(4, 1, 1);
  return sprite;
}

// ─── Create a new organic emotion node ────────────────────────────────────────
function createNode(name, pct, region) {
  const b   = regionBounds(region);
  const rng = (lo, hi) => lo + Math.random() * (hi - lo);

  const pos = new THREE.Vector3();
  for (let attempt = 0; attempt < 30; attempt++) {
    pos.set(rng(b.x[0], b.x[1]), rng(b.y[0], b.y[1]), rng(b.z[0], b.z[1]));
    if (!Array.from(nodesByName.values()).some(e => e.pos.distanceTo(pos) < 2.5)) break;
  }

  const { h, s, l } = regionColor(region);
  const colorObj  = new THREE.Color().setHSL(h, s, l);
  const hexColor  = colorObj.getHex();
  const r         = 0.8 + (Math.min(pct, 50) / 50) * 1.8;
  const geoDetail = perfTier === 'high' ? 2 : 1;

  // Core: white with node-colour emissive — white-hot centre without bloom
  const coreMesh = new THREE.Mesh(
    new THREE.IcosahedronGeometry(r * 0.4, geoDetail + 1),
    new THREE.MeshStandardMaterial({
      color: 0xffffff, emissive: new THREE.Color(hexColor),
      emissiveIntensity: 1.2, roughness: 0.3, metalness: 0.1,
    })
  );

  // Membrane: organically deformed semi-transparent shell
  const memGeo  = new THREE.IcosahedronGeometry(r, geoDetail);
  const posAttr = memGeo.attributes.position;
  for (let i = 0; i < posAttr.count; i++) {
    posAttr.setX(i, posAttr.getX(i) * (1 + (Math.random() - 0.5) * 0.12));
    posAttr.setY(i, posAttr.getY(i) * (1 + (Math.random() - 0.5) * 0.12));
    posAttr.setZ(i, posAttr.getZ(i) * (1 + (Math.random() - 0.5) * 0.12));
  }
  posAttr.needsUpdate = true;
  memGeo.computeVertexNormals();

  const memMesh = new THREE.Mesh(memGeo, new THREE.MeshStandardMaterial({
    color: hexColor, emissive: new THREE.Color(hexColor),
    emissiveIntensity: 2.5, // birth flash — decays to 0.4 baseline
    transparent: true, opacity: 0.55,
    roughness: 0.4, metalness: 0.2, depthWrite: false,
  }));

  const group = new THREE.Group();
  group.add(coreMesh);
  group.add(memMesh);
  group.position.copy(pos);
  scene.add(group);

  // Always-on label, 1.5 units above node centre
  const label = makeNodeSprite(name);
  label.position.set(pos.x, pos.y + 1.5, pos.z);
  scene.add(label);

  const em = { id: name, pct, color: hexColor, pos, r, region,
               _group: group, _mesh: memMesh, _core: coreMesh,
               _label: label, _baseR: r, _flashTime: 0.0 };

  nodeMeshes.push(memMesh);
  nodeDataMap.set(memMesh.uuid, em);
  nodeDataMap.set(coreMesh.uuid, em);
  nodesByName.set(name, em);
  return em;
}

// ─── Shared comet geometry ────────────────────────────────────────────────────
const _cometGeo = new THREE.SphereGeometry(0.15, 5, 5);

// ─── Add a CatmullRom path between two nodes ──────────────────────────────────
function addPath(emA, emB, weight = 1) {
  const mid = emA.pos.clone().lerp(emB.pos, 0.5).add(
    new THREE.Vector3((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8)
  );
  const curve   = new THREE.CatmullRomCurve3([emA.pos, mid, emB.pos]);
  const blended = blendColors(emA.color, emB.color);
  const opacity = Math.min(0.10 + (weight - 1) * 0.035, 0.55);
  const line    = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(curve.getPoints(60)),
    new THREE.LineBasicMaterial({ color: blended, transparent: true, opacity })
  );
  scene.add(line);
  const path = { curve, color: blended, line, nextFireAt: clock.getElapsedTime() + 2 + Math.random() * 6, activePulses: [] };
  pathObjects.push(path);
  return path;
}

// ─── Fire a comet cluster along a path ───────────────────────────────────────
function firePath(path, currentTime) {
  const count = perfTier === 'high' ? (1 + Math.floor(Math.random() * 3)) : 1;
  const speed = 0.8 + Math.random() * 0.5;
  for (let i = 0; i < count; i++) {
    const mesh = new THREE.Mesh(_cometGeo, new THREE.MeshStandardMaterial({
      color: path.color, emissive: new THREE.Color(path.color),
      emissiveIntensity: 2.0, metalness: 1.0, roughness: 0.0,
    }));
    scene.add(mesh);
    path.activePulses.push({ t: i * 0.06, speed, mesh });
  }
  path.nextFireAt = currentTime + 2 + Math.random() * 6;
}

// ─── Remove all live paths ────────────────────────────────────────────────────
function clearPaths() {
  pathObjects.forEach(path => {
    scene.remove(path.line);
    path.line.geometry.dispose();
    path.line.material.dispose();
    path.activePulses.forEach(p => { scene.remove(p.mesh); p.mesh.material.dispose(); });
  });
  pathObjects.length = 0;
}

// ─── Camera anchor: orbit around node centroid ────────────────────────────────
function updateCameraAnchor() {
  const nodes = Array.from(nodesByName.values());
  if (!nodes.length) return;
  const centroid = nodes.reduce((v, em) => v.add(em.pos), new THREE.Vector3()).divideScalar(nodes.length);
  controls.target.copy(centroid);
}

// ─── Auto-spin screensaver ────────────────────────────────────────────────────
let _autoSpin = false;
let _spinAngle = 0; // current azimuth in radians

const _spinBtn = document.getElementById('spin-button');

function _computeSpinRadius() {
  const nodes = Array.from(nodesByName.values());
  if (!nodes.length) return 35; // default before data arrives

  const centroid = nodes.reduce((v, em) => v.add(em.pos.clone()), new THREE.Vector3()).divideScalar(nodes.length);
  // Bounding sphere radius from centroid
  let maxR = 0;
  nodes.forEach(em => {
    const d = centroid.distanceTo(em.pos) + em.r + 1.5; // +node radius +label headroom
    if (d > maxR) maxR = d;
  });

  // Project bounding sphere onto screen using vertical FOV and aspect.
  // We want the sphere to fill at most (1 - safeMargin) of the smaller screen dimension.
  const safeMargin = 0.18; // 18% gap on each side
  const fovRad = camera.fov * Math.PI / 180;
  const aspect = container.clientWidth / container.clientHeight;
  // Effective half-FOV for the constraining dimension (portrait: height wins, landscape: width wins)
  const halfFovV = fovRad / 2;
  const halfFovH = Math.atan(Math.tan(halfFovV) * aspect);
  const halfFov  = Math.min(halfFovV, halfFovH);
  const dist = maxR / (Math.tan(halfFov) * (1 - safeMargin));

  return Math.min(Math.max(dist, controls.minDistance), controls.maxDistance);
}

function _enterSpin() {
  _autoSpin = true;
  _spinBtn.classList.add('active');
  hideTooltip();
  _focusTween = null; // cancel any in-progress focus tween

  // Seed spin angle from current camera azimuth so there's no jump
  const offset = camera.position.clone().sub(controls.target);
  _spinAngle = Math.atan2(offset.x, offset.z);
}

function _exitSpin() {
  _autoSpin = false;
  _spinBtn.classList.remove('active');
}

_spinBtn.addEventListener('click', () => {
  if (_autoSpin) _exitSpin(); else _enterSpin();
});

// Any tap anywhere (canvas or overlaid UI) cancels spin
document.addEventListener('pointerdown', () => { if (_autoSpin) _exitSpin(); });

// Flutter-callable stop (screen leave, back button, etc.)
function stopSpin() { if (_autoSpin) _exitSpin(); }
window.stopSpin = stopSpin;

// ─── Programmatic camera focus tween ─────────────────────────────────────────
function focusOnNode(nodeName) {
  const em = nodesByName.get(nodeName);
  if (!em) return;
  hideTooltip();
  _exitSpin(); // cancel spin so tween isn't suppressed and doesn't resume after
  const dir = em.pos.lengthSq() > 0.001 ? em.pos.clone().normalize() : new THREE.Vector3(0, 0, 1);
  _focusTween = {
    startPos: camera.position.clone(), endPos: em.pos.clone().add(dir.multiplyScalar(12)),
    startTarget: controls.target.clone(), endTarget: em.pos.clone(),
    elapsed: 0, duration: 1.2, em,
  };
}
window.focusOnNode = focusOnNode;

// ─── Tooltip (percentage only on tap) ────────────────────────────────────────
const tooltip   = document.getElementById('tooltip');
const ttPct     = document.getElementById('tt-pct');
const raycaster = new THREE.Raycaster();
const mouse     = new THREE.Vector2();

function showTooltip(em, screenX, screenY) {
  ttPct.textContent = em.pct.toFixed(1) + '%';
  tooltip.style.display = 'block';
  const tw = tooltip.offsetWidth  || 80;
  const th = tooltip.offsetHeight || 48;
  tooltip.style.left = Math.min(screenX + 14, W - tw - 8) + 'px';
  tooltip.style.top  = Math.min(screenY - 10, H - th - 8) + 'px';
}
function hideTooltip() { tooltip.style.display = 'none'; }

// pointerdown/up guards against WKWebView swallowing click events during orbit
let _pdX = 0, _pdY = 0;
renderer.domElement.addEventListener('pointerdown', e => { _pdX = e.clientX; _pdY = e.clientY; });
renderer.domElement.addEventListener('pointerup', e => {
  if ((e.clientX - _pdX) ** 2 + (e.clientY - _pdY) ** 2 > 25) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
  mouse.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hit = raycaster.intersectObjects(nodeMeshes)[0];
  if (hit) {
    const em = nodeDataMap.get(hit.object.uuid);
    if (em) { showTooltip(em, e.clientX - rect.left, e.clientY - rect.top); return; }
  }
  hideTooltip();
});

// ─── Remove all dynamic nodes from the scene ─────────────────────────────────
function clearNodes() {
  nodesByName.forEach(em => {
    scene.remove(em._group);
    em._core.geometry.dispose();
    em._core.material.dispose();
    em._mesh.geometry.dispose();
    em._mesh.material.dispose();
    scene.remove(em._label);
    em._label.material.map.dispose();
    em._label.material.dispose();
  });
  nodeMeshes.length = 0;
  nodeDataMap.clear();
  nodesByName.clear();
}

// ─── Core data processor ──────────────────────────────────────────────────────
function processBrainData(data) {
  if (!data) { dbg('null data'); return; }
  // Pure-focus message (no nodes): focus only, nodes must already exist.
  if (typeof data.focus === 'string' && !Array.isArray(data.nodes)) { dbg('focus: ' + data.focus); focusOnNode(data.focus); return; }
  if (!Array.isArray(data.nodes)) { dbg('no nodes, keys=' + Object.keys(data).join(',')); return; }
  dbg(data.nodes.length + ' nodes, ' + (data.edges ? data.edges.length : 0) + ' edges');

  // Remove only nodes absent from this update, preserving existing nodes in place
  // so the update-in-place branch below (flash + scale) can actually fire.
  const incomingNames = new Set(data.nodes.map(n => n.name).filter(Boolean));
  nodesByName.forEach((em, name) => {
    if (!incomingNames.has(name)) {
      scene.remove(em._group);
      em._core.geometry.dispose(); em._core.material.dispose();
      em._mesh.geometry.dispose();  em._mesh.material.dispose();
      scene.remove(em._label);
      em._label.material.map.dispose(); em._label.material.dispose();
      const idx = nodeMeshes.indexOf(em._mesh);
      if (idx !== -1) nodeMeshes.splice(idx, 1);
      nodeDataMap.delete(em._mesh.uuid);
      nodesByName.delete(name);
    }
  });

  let newNodes = 0;
  data.nodes.forEach(({ name, percent, region }) => {
    if (!name || percent === undefined) return;
    const safeRegion = ['Prefrontal', 'Amygdala', 'Nucleus', 'Insula'].includes(region) ? region : 'Prefrontal';
    if (nodesByName.has(name)) {
      const em = nodesByName.get(name);
      em.pct   = percent;
      em._group.scale.setScalar(0.7 + (Math.min(percent, 50) / 50) * 2.3);
      em._mesh.material.emissiveIntensity = 2.5;
      em._flashTime = 0.0;
    } else {
      createNode(name, percent, safeRegion);
      newNodes++;
    }
  });
  dbg('created ' + newNodes + ' new, total=' + nodesByName.size);
  if (newNodes > 0) updateCameraAnchor();

  if (Array.isArray(data.edges)) {
    clearPaths();
    const now = clock.getElapsedTime();
    data.edges.forEach(({ source, target, weight = 1 }) => {
      const emA = nodesByName.get(source), emB = nodesByName.get(target);
      if (emA && emB) firePath(addPath(emA, emB, weight), now);
    });
  }

  // Focus after nodes are built so nodesByName is populated.
  if (typeof data.focus === 'string') { dbg('focus (post-nodes): ' + data.focus); focusOnNode(data.focus); }
}

// ─── Native bridge (Flutter WebView → runJavaScript) ─────────────────────────
window.updateBrainDataNative = function(jsonString) {
  let parsed;
  try { parsed = JSON.parse(jsonString); } catch(e) { dbg('parse error: ' + e); return; }
  dbg('native: nodes=' + (parsed.nodes?.length ?? '?'));
  processBrainData(parsed);
};

// ─── Web iframe bridge (Flutter web → postMessage) ───────────────────────────
document.getElementById('back-button').addEventListener('click', () => {
  window.parent.postMessage(JSON.stringify({ type: 'flutter_nav', action: 'pop' }), '*');
});

window.addEventListener('message', e => {
  let data;
  try { data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch { return; }
  if (data.type === 'flutter_nav' && data.action === 'show_back') {
    document.getElementById('back-button').style.display = 'flex';
    return;
  }
  processBrainData(data);
});

// ─── Animation loop ───────────────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t  = clock.getElapsedTime();

  // ── Membrane flash decay + breathing ─────────────────────────────────────
  nodeMeshes.forEach(m => {
    const em = nodeDataMap.get(m.uuid);
    if (!em) return;
    em._flashTime += dt;
    m.material.emissiveIntensity = Math.max(0.4, 2.5 * Math.exp(-em._flashTime * 3.5));
    const breathe = 1 + 0.04 * Math.sin(t * 1.4 + em._group.position.x);
    em._group.scale.x = em._group.scale.x * 0.97 + breathe * 0.03;
    em._group.scale.y = em._group.scale.y * 0.97 + breathe * 0.03;
    em._group.scale.z = em._group.scale.z * 0.97 + breathe * 0.03;
  });

  // ── Comet pulses ─────────────────────────────────────────────────────────
  pathObjects.forEach(path => {
    for (let i = path.activePulses.length - 1; i >= 0; i--) {
      const p = path.activePulses[i];
      p.t += p.speed * dt;
      if (p.t >= 1.0) { scene.remove(p.mesh); p.mesh.material.dispose(); path.activePulses.splice(i, 1); }
      else              p.mesh.position.copy(path.curve.getPointAt(p.t));
    }
    if (t >= path.nextFireAt) firePath(path, t);
  });

  // ── Focus tween ──────────────────────────────────────────────────────────
  if (_focusTween) {
    controls.enabled = false;
    _focusTween.elapsed += dt;
    const raw  = Math.min(_focusTween.elapsed / _focusTween.duration, 1.0);
    const ease = raw < 0.5 ? 4 * raw ** 3 : 1 - (-2 * raw + 2) ** 3 / 2;
    camera.position.lerpVectors(_focusTween.startPos, _focusTween.endPos, ease);
    controls.target.lerpVectors(_focusTween.startTarget, _focusTween.endTarget, ease);
    camera.lookAt(controls.target);
    if (raw >= 1.0) {
      controls.enabled = true;
      const ndc = _focusTween.em.pos.clone().project(camera);
      showTooltip(_focusTween.em,
        (ndc.x * 0.5 + 0.5) * container.clientWidth,
        (-ndc.y * 0.5 + 0.5) * container.clientHeight);
      _focusTween = null;
    }
  }

  // ── Always-on node labels: opacity by size, camera distance, overlap ─────
  const emList    = Array.from(nodesByName.values());
  const screenPos = emList.map(em => {
    const ndc = em._group.position.clone().project(camera);
    return { em, sx: (ndc.x * 0.5 + 0.5) * container.clientWidth,
                  sy: (-ndc.y * 0.5 + 0.5) * container.clientHeight };
  });
  emList.forEach(em => {
    if (!em._label) return;
    const camDist = camera.position.distanceTo(em._group.position);
    const baseOp  = 0.6 + Math.min((em.r - 0.8) / 1.8, 1.0) * 0.4;
    let   opacity = camDist < 8 ? baseOp * (camDist / 8) : baseOp;
    const sp = screenPos.find(s => s.em === em);
    if (sp) {
      const nearLarger = screenPos.some(s =>
        s.em !== em && s.em.r > em.r && (s.sx - sp.sx) ** 2 + (s.sy - sp.sy) ** 2 < 6400
      );
      if (nearLarger) opacity = Math.min(opacity, 0.3);
    }
    em._label.material.opacity = opacity;
    em._label.position.set(em._group.position.x, em._group.position.y + 1.5, em._group.position.z);
  });

  // ── Region labels fade when a data node is nearby ─────────────────────────
  regionLabels.forEach(({ sprite, pos }) => {
    const near = emList.some(em => em._group.position.distanceTo(pos) < 3);
    sprite.material.opacity = near ? 0.2 : 0.5;
  });

  // ── Auto-spin screensaver ────────────────────────────────────────────────
  if (_autoSpin && !_focusTween) {
    const SPEED = 0.28; // radians per second (~16°/s — one full rotation ≈ 22s)
    _spinAngle += SPEED * dt;

    const nodes = Array.from(nodesByName.values());
    const centroid = nodes.length
      ? nodes.reduce((v, em) => v.add(em.pos.clone()), new THREE.Vector3()).divideScalar(nodes.length)
      : new THREE.Vector3();

    const radius = _computeSpinRadius();
    // Gentle elevation: fixed at ~20° above the centroid plane
    const elevation = Math.PI / 9;
    camera.position.set(
      centroid.x + radius * Math.sin(_spinAngle) * Math.cos(elevation),
      centroid.y + radius * Math.sin(elevation),
      centroid.z + radius * Math.cos(_spinAngle) * Math.cos(elevation),
    );
    controls.target.copy(centroid);
    camera.lookAt(centroid);
    controls.enabled = false;
  } else if (!_autoSpin && !controls.enabled && !_focusTween) {
    controls.enabled = true;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

// ─── Resize ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  const w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// ─── Helpers ─────────────────────────────────────────────────────────────────
function blendColors(ca, cb) {
  return new THREE.Color(ca).lerp(new THREE.Color(cb), 0.5).getHex();
}

// Signal Flutter WebView that Three.js is fully initialised.
// BrainChannel is only defined inside webview_flutter; this is a no-op in a browser.
dbg('module done, BrainChannel=' + (typeof BrainChannel));
if (typeof BrainChannel !== 'undefined') {
  BrainChannel.postMessage('ready');
  dbg('ready signal sent');
}
</script>
</body>
</html>
