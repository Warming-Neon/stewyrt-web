name: stewyrt
description: "An anonymous, audio-only social sentiment platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  appinio_swiper: ^2.0.1
  provider: ^6.1.2
  record: ^5.1.2
  just_audio: ^0.9.40
  uuid: ^4.5.1
  path_provider: ^2.1.4
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  web: ^1.1.1
  webview_flutter: ^4.13.1
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  # record_linux 0.7.2 is incompatible with record_platform_interface 1.5.0.
  # Pinning to 1.3.0 fixes the mismatch. Not a target platform — iOS/Android only.
  record_linux: ^1.3.0

flutter:
  uses-material-design: true
  assets:
    - web/brain_visualizer.html

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/stewyrt_icon.png"
  min_sdk_android: 21
